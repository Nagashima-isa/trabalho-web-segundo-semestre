<!DOCTYPE html>//cabecalho
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyCat - Faça Login</title>
    <link rel="stylesheet" href="../estilos/estilo.css">
</head>
<body class="light-theme">

    <header class="meu-menu">
        <div class="logo"> <h2 href="index.html">HappyCat</h2></div>
        <div class="menu-direita"> //onde dados entram
            <nav>
                <a href="login.html" class="active">Login</a>
                <a href="gatos.html">Adotar</a>
                <a href="voluntarios.html">Voluntários</a>
            </nav>
            <button id="btnTema" class="btn-tema" onclick="alternarTema()"> Tema</button>
        </div>
    </header>

    <div class="conteudo-principal row">
        <aside class="col-3 minha-sidebar">
            <ul class="sidebar-links"> //o conteudo do lado
                <li><a href="index.html" class="active-link">Sobre a ONG</a></li>
                <li><a href="voluntarios.html">Nossos Voluntários</a></li>
            </ul>
        </aside>

        <main class="col-9">
            
      <div id="caixaPerfil" class="caixa-formulario shadow escondido animate-fade" style="max-width: 100%;">
                <div class="caixa-header bg-success d-flex-between">
                    <span>Bem-vindo(a), <span id="userNameHeader"></span>!</span>
                    <button onclick="logoutUser()" class="btn btn-perigo btn-sm">Sair</button>
                </div>
                <div class="caixa-body">
                    <h3 class="cor-sucesso" style="margin-bottom: 10px;">Seu Perfil</h3>
                    <p><strong>Usuário:</strong> <span id="profileUser"></span></p>
                    <p><strong>E-mail:</strong> <span id="profileEmail"></span></p>
                    <button onclick="prepararEdicaoUsuario()" class="btn btn-aviso btn-sm" style="margin-top: 15px;">Editar Meus Dados</button>
                </div>
            </div>

            <div id="caixaAuth" class="caixa-formulario shadow animate-fade">
                <div class="caixa-header bg-success">Faça login aqui</div>
                <div class="caixa-body">
                    <form id="formLogin">
                        <div class="campo-grupo">
                            <label for="loginUser">Usuário / Nickname</label>
                            <input type="text" id="loginUser">
                        </div>
                        <div class="campo-grupo">
                            <label for="loginPass">Senha</label>
                            <input type="password" id="loginPass">
                        </div>
                        <button type="submit" class="btn btn-sucesso btn-largo">Entrar</button>
                    </form>
                    <p class="txt-centro small">Não tem conta? <button class="btn-link" onclick="abrirModalUser()">Cadastre-se aqui</button></p>
                </div>
            </div>
        </main>
    </div>

    <div id="meuModalUser" class="fundo-modal escondido">
        <div class="janela-modal shadow animate-down">
            <div class="modal-topo">
                <h3 id="modalCadastroUserLabel">Criar Nova Conta</h3>
                <button class="btn-fechar" onclick="fecharModalUser()">&times;</button>
            </div>
            <div class="modal-corpo">
                <form id="formCadastroUser">
                    <input type="hidden" id="editUserFlag" value="false">
                    <div class="campo-grupo">
                        <label>Usuário / Nickname</label>
                        <input type="text" id="regUser" required>
                    </div>
                    <div class="campo-grupo">
                        <label>E-mail</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="campo-grupo">
                        <label>Senha</label>
                        <input type="password" id="regPass" required>
                    </div>
                    <button type="submit" class="btn btn-sucesso btn-largo">Confirmar Registro</button>
                </form>
            </div>
        </div>
    </div>


    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
