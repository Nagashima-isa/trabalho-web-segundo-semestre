<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyCat - Voluntários</title>
    <link rel="stylesheet" href="../estilos/estilo.css">
</head>
<body class="light-theme">

    <header class="meu-menu">
        <div class="logo"> <h2 href="index.html">HappyCat</h2></div>
        <div class="menu-direita">
            <nav>
                <a href="login.html" class="active">Login</a>
                <a href="gatos.html">Adotar</a>
                <a href="voluntarios.html">Voluntários</a>
            </nav>
            <button id="btnTema" class="btn-tema" onclick="alternarTema()"> Tema</button>
        </div>
    </header>

    <div class="conteudo-principal row">
        <aside class="col-3 minha-sidebar">
            <ul class="sidebar-links">
                <li><a href="index.html" class="active-link">Sobre a ONG</a></li>
                <li><a href="gatos.html">Adote Um Gato</a></li>
            </ul>
        </aside>

        <main class="col-9">
            <div class="titulo-pagina row d-flex-between">
                <div>
                    <h1>Voluntários da ONG</h1>
                    <p>Controle de equipes, horários e dias de apoio técnico.</p>
                </div>
                <button class="btn btn-sucesso" onclick="abrirModalVol()">+ Novo Voluntário</button>
            </div>
            
            <div class="busca-bloco">
                <input type="text" id="buscaVoluntario" class="campo-busca" placeholder=" Filtrar voluntários por nome...">
            </div>

            <div class="tabela-container shadow">
                <table class="tabela-amadora">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome Completo</th>
                            <th>Disponibilidade</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaVoluntarios"></tbody>
                </table>
            </div>

            <div class="zona-perigo">
                <button class="btn btn-perigo btn-sm" onclick="excluirTodosVoluntarios()"> Limpar Todos os Voluntários</button>
            </div>
        </main>
    </div>

    <div id="meuModalVol" class="fundo-modal escondido">
        <div class="janela-modal shadow animate-down">
            <div class="modal-topo">
                <h3 id="modalVolLabel">Adicionar Voluntário</h3>
                <button class="btn-fechar" onclick="fecharModalVol()">&times;</button>
            </div>
            <div class="modal-corpo">
                <form id="formVoluntario">
                    <input type="hidden" id="volId">
                    <div class="campo-grupo">
                        <label>Nome do Voluntário</label>
                        <input type="text" id="nomeVol" required>
                    </div>
                    <div class="campo-grupo">
                        <label>Disponibilidade (Ex: Fins de semana)</label>
                        <input type="text" id="dispVol" required>
                    </div>
                    <button type="submit" class="btn btn-sucesso btn-largo">Salvar Registro</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/voluntarios.js"></script>
</body>
</html>
