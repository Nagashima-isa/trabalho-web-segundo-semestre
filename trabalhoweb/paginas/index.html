<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyCat</title>
    <link rel="stylesheet" href="../estilos/estilo.css">
</head>
<body class="light-theme">

    <header class="meu-menu">
        <div class="logo"> <h2>HappyCat</a></h2></div>
        <div class="menu-direita">
            <nav>
                <a href="login.html" class="active">Login</a>
                <a href="gatos.html">Adotar</a>
                <a href="voluntarios.html">Voluntários</a>
            </nav>
            <button id="btnTema" class="btn-tema" onclick="alternarTema()"> Tema</button>
        </div>
    </header>

    <div class="conteudo-principal row">
        <aside class="col-3 minha-sidebar">
            <ul class="sidebar-links">
                <li><a href="index.html" class="active-link">Sobre a ONG</a></li>
                <li><a href="voluntarios.html">Nossos Voluntários</a></li>
            </ul>
        </aside>

        <main class="col-9">
            <div class="titulo-pagina">
                <h1>Conheça nossa ONG</h1>
                <p>Um pouco sobre nós, apoio voluntário e adoções.</p>
            </div>

            <div class="carrossel-container shadow" style="margin-bottom: 30px; max-width: 80%; height: 700px;">
                <div class="carrossel-slides" id="carrosselSlides">
                    <div class="slide"><img src="../imagens/gato1.avif" alt="Gato 1"></div>
                    <div class="slide"><img src="../imagens/gato2.avif" alt="Gato 2"></div>
                    <div class="slide"><img src="../imagens/gato6.jpeg" alt="Gato 6"></div>
                </div>
                
                <button class="carrossel-btn btn-prev" type="button" onclick="mudarSlide(-1)">&#10094;</button>
                <button class="carrossel-btn btn-next" type="button" onclick="mudarSlide(1)">&#10095;</button>
                
                <div class="carrossel-indicadores" id="carrosselIndicadores">
                    <span class="bola ativa" onclick="irParaSlide(0)"></span>
                    <span class="bola" onclick="irParaSlide(1)"></span>
                    <span class="bola" onclick="irParaSlide(2)"></span>
                  
                </div>
            </div>

            

            

    <script src="../js/carrossel.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
